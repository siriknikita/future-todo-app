spring:
  application:
    name: future-todo-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/futuretodo}
    username: ${DB_USER:futuretodo}
    password: ${DB_PASSWORD:changeme}
  flyway:
    locations: >-
      classpath:db/migration/accounts,
      classpath:db/migration/tasks,
      classpath:db/migration/sharing,
      classpath:db/migration/sync,
      classpath:db/migration/notifications
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 2000
      mail.smtp.timeout: 2000
      mail.smtp.writetimeout: 2000

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    path: /v3/api-docs

app:
  frontend-url: ${FRONTEND_URL:http://localhost:8081}
  mail:
    from: no-reply@futuretodo.local
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    access-ttl-minutes: 15
    refresh-ttl-days: 30
  cors:
    allowed-origins: ${CORS_ORIGINS:*}
  rate-limit:
    attempts-per-minute: 10
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  oauth:
    google:
      client-id: ${OAUTH_GOOGLE_CLIENT_ID:}
    apple:
      client-id: ${OAUTH_APPLE_CLIENT_ID:}
    microsoft:
      client-id: ${OAUTH_MICROSOFT_CLIENT_ID:}
