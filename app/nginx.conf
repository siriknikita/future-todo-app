server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Drift on web needs wasm served with the right MIME type.
    types {
        application/wasm wasm;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    # Single-page app: fall back to index.html for go_router paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the entry points so new deployments are picked up.
    location ~* ^/(index\.html|flutter_service_worker\.js|version\.json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The client talks to the backend directly (base URL set at build time), so no API proxy here.
}
