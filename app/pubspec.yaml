name: future_todo
description: Future Todo client (Flutter, web-first for Lab 2 Part One).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ">=2.5.1 <3.0.0"
  go_router: ^14.2.0
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  intl: any # pinned transitively by flutter_localizations
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  http: ^1.2.0
  web_socket_channel: ^3.0.0
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  drift_dev: ^2.20.0
  build_runner: ^2.4.11
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
