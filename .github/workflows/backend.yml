name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "api/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "api/**"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint (ktlint + detekt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1" # no wrapper committed yet
      - name: ktlint
        run: gradle ktlintCheck
      - name: detekt
        run: gradle detekt

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1" # no wrapper committed yet
      - name: Unit tests (JUnit 5 + MockK)
        run: gradle test --tests "*AuthServiceTest" --tests "*JwtAndLimiterTest" --tests "*LwwTest" --tests "*HlcClockTest" --tests "*RecurrenceCalculatorTest" --tests "*EntitySpecsTest" --tests "*SearchAndSmartListTest" --tests "*ModularityTest"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-unit-test-report
          path: backend/build/reports/tests/test

  integration-tests:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest # Docker is preinstalled, Testcontainers uses it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1" # no wrapper committed yet
      - name: Integration tests
        run: gradle test --tests "*IntegrationTest"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-integration-test-report
          path: backend/build/reports/tests/test

  e2e-tests:
    name: End-to-end API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1" # no wrapper committed yet
      - name: E2E tests (HTTP level, Testcontainers)
        run: gradle test --tests "*E2eTest"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-e2e-test-report
          path: backend/build/reports/tests/test

  coverage:
    name: Coverage gate (Kover >= 80%)
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1" # no wrapper committed yet
      - name: Verify coverage (runs all tests; 80% rule is in build.gradle.kts)
        run: gradle koverVerify
      - name: HTML coverage report
        if: always()
        run: gradle koverHtmlReport
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: backend/build/reports/kover/html

  build:
    name: Build jar and Docker image
    runs-on: ubuntu-latest
    needs: [lint, coverage]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1" # no wrapper committed yet
      - name: Assemble
        run: gradle bootJar -x test
      - name: Build Docker image (not pushed)
        working-directory: .
        run: docker build -t future-todo-backend:ci backend
