# App CI (Flutter web), steps 2-5 of the pipeline (build, static analysis, L1, L2).
# Called by pipeline.yml on every push; not triggered on its own. L2 = local
# integration: real Drift database in the browser, no backend.
name: App CI (Flutter web)

on:
  workflow_call:

permissions:
  contents: read

env:
  COVERAGE_MIN: "80"

defaults:
  run:
    working-directory: app

jobs:
  analyze:
    name: Static analysis (very_good_analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - name: Analyze
        run: flutter analyze --fatal-infos

  unit-tests:
    name: L1 Unit and widget tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
      - name: Install system SQLite (Drift tests use NativeDatabase.memory())
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Unit and widget tests (flutter_test)
        run: flutter test --coverage
      - name: Coverage gate (>= ${{ env.COVERAGE_MIN }}%)
        run: |
          # Sum LF (lines found) and LH (lines hit) from lcov.info, ignoring generated files.
          awk -v min="$COVERAGE_MIN" '
            /^SF:/ { skip = ($0 ~ /\.g\.dart|\.freezed\.dart|\.gen\.dart|\/generated\/|\/l10n\/app_localizations/) }
            /^LF:/ && !skip { lf += substr($0, 4) }
            /^LH:/ && !skip { lh += substr($0, 4) }
            END {
              if (lf == 0) { print "No coverage data found"; exit 1 }
              pct = lh * 100 / lf
              printf "Line coverage: %.1f%% (min %s%%)\n", pct, min
              if (pct < min) exit 1
            }' coverage/lcov.info
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-coverage
          path: app/coverage/lcov.info

  e2e-web:
    name: L2 UI test on web (guest flow, real Drift, no backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
        with:
          prepare-web: "true"
      - name: Set up chromedriver
        uses: nanasess/setup-chromedriver@v2
      - name: Run the guest-flow integration test
        run: |
          chromedriver --port=4444 &
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/app_test.dart \
            -d web-server --browser-name=chrome --headless

  # Step 2 of the method: the artifact is built in parallel with the checks; the
  # pipeline deploys it only after every check of this workflow has passed.
  build-web:
    name: Build artifact (web build in an nginx Docker image)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the image (Flutter web build inside, see app/Dockerfile)
        working-directory: .
        run: |
          # The API address is compiled into the web build; the test environments
          # publish the backend on localhost:8080 (see deploy/docker-compose.yml).
          docker build --build-arg API_BASE_URL=http://localhost:8080 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t future-todo-app:ci app
          docker save future-todo-app:ci | gzip > "$RUNNER_TEMP/web.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: web-image
          path: ${{ runner.temp }}/web.tar.gz
          retention-days: 7
          compression-level: 0 # already gzipped
